name: release

# A tag v* publishes a version: the app for each system (the .dmg, the
# installer, the AppImage and the .deb), the command line for servers, and
# checksums.txt, which the app's updater checks every download against.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  # A release published by hand, built locally with the same scripts, is
  # left as it is rather than rebuilt over.
  check:
    runs-on: ubuntu-22.04
    outputs:
      exists: ${{ steps.release.outputs.exists }}
    steps:
      - id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${{ github.ref_name }}" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

  macos:
    needs: check
    if: needs.check.outputs.exists != 'true'
    runs-on: macos-14
    env:
      HAS_CERT: ${{ secrets.MACOS_CERT_P12 != '' }}
      HAS_NOTARY: ${{ secrets.NOTARY_KEY_P8 != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: go.mod }
      - run: go test -count=1 ./...
      - name: Signing certificate
        if: env.HAS_CERT == 'true'
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: scripts/ci/import-macos-cert.sh
      - name: Notarisation key
        if: env.HAS_NOTARY == 'true'
        env:
          NOTARY_KEY_P8: ${{ secrets.NOTARY_KEY_P8 }}
        run: |
          echo "$NOTARY_KEY_P8" | base64 --decode > "$RUNNER_TEMP/notary.p8"
          echo "NOTARY_KEY=$RUNNER_TEMP/notary.p8" >> "$GITHUB_ENV"
      - name: Build, sign and notarise
        env:
          VERSION: ${{ github.ref_name }}
          SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER: ${{ secrets.NOTARY_ISSUER }}
        run: scripts/build-macos.sh
      - uses: actions/upload-artifact@v4
        with: { name: app-macos, path: build/bin/WhatsApp-MCP.dmg }

  windows:
    needs: check
    if: needs.check.outputs.exists != 'true'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: go.mod }
      - run: sudo apt-get update && sudo apt-get install -y nsis unzip
      - env: { VERSION: "${{ github.ref_name }}" }
        run: scripts/build-windows.sh
      - uses: actions/upload-artifact@v4
        with: { name: app-windows, path: build/bin/WhatsApp-MCP-Setup.exe }

  linux:
    needs: check
    if: needs.check.outputs.exists != 'true'
    strategy:
      matrix:
        include:
          - { arch: amd64, runner: ubuntu-22.04 }
          - { arch: arm64, runner: ubuntu-22.04-arm }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - name: Build in Ubuntu 22.04
        env: { VERSION: "${{ github.ref_name }}" }
        run: |
          docker build -t build-linux build/linux
          docker run --rm --privileged -v "$PWD:/src" -w /src -e VERSION build-linux bash -c 'go test -tags gtk3 -count=1 ./... && scripts/build-linux.sh'
          sudo chown -R "$(id -u)" build/bin
      - uses: actions/upload-artifact@v4
        with:
          name: "app-linux-${{ matrix.arch }}"
          path: |
            build/bin/*.AppImage
            build/bin/*.deb

  cli:
    needs: check
    if: needs.check.outputs.exists != 'true'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: go.mod }
      - name: The command line, for servers and install.sh
        env: { VERSION: "${{ github.ref_name }}" }
        run: |
          mkdir -p dist
          for target in darwin/arm64 darwin/amd64 linux/arm64 linux/amd64 windows/amd64; do
            os="${target%/*}"; arch="${target#*/}"
            bin=whatsapp-mcp; [ "$os" = windows ] && bin=whatsapp-mcp.exe
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" go build -trimpath \
              -ldflags "-s -w -X main.version=${VERSION}" -o "$bin" ./cmd/whatsapp-mcp
            if [ "$os" = windows ]; then
              zip -q "dist/whatsapp-mcp_${os}_${arch}.zip" "$bin"
            else
              tar -czf "dist/whatsapp-mcp_${os}_${arch}.tar.gz" "$bin"
            fi
            rm "$bin"
          done
      - uses: actions/upload-artifact@v4
        with: { name: cli, path: dist/* }

  publish:
    needs: [macos, windows, linux, cli]
    runs-on: ubuntu-22.04
    env:
      HAS_GPG: ${{ secrets.GPG_PRIVATE_KEY != '' }}
    steps:
      - uses: actions/download-artifact@v4
        with: { path: dist, merge-multiple: true }
      - name: Checksums
        run: cd dist && sha256sum -- * > checksums.txt && cat checksums.txt
      - name: Sign the checksums
        if: env.HAS_GPG == 'true'
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          echo "$GPG_PRIVATE_KEY" | gpg --batch --import
          gpg --batch --pinentry-mode loopback --passphrase "$GPG_PASSPHRASE" --armor --detach-sign dist/checksums.txt
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" dist/* --repo "${{ github.repository }}" \
            --title "WhatsApp MCP ${{ github.ref_name }}" --generate-notes
