name: sidecars

# Builds the programs transcription downloads when it is turned on (whisper-cli
# and a minimal ffmpeg, one archive per system), publishes them as a release
# of their own, and opens a pull request pinning them in
# internal/sidecar/manifest.json. They change rarely, so this runs by hand.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag for this set, e.g. sidecars-1"
        required: true

permissions:
  contents: write
  pull-requests: write

env:
  WHISPER_VERSION: "1.9.2"
  FFMPEG_VERSION: "7.1.1"

jobs:
  macos:
    runs-on: macos-14
    env:
      HAS_CERT: ${{ secrets.MACOS_CERT_P12 != '' }}
    steps:
      - uses: actions/checkout@v4
      - name: Signing certificate
        if: env.HAS_CERT == 'true'
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: scripts/ci/import-macos-cert.sh
      - name: Build
        env:
          SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
        run: |
          scripts/sidecars/build-whisper.sh out
          ARCH=arm64 scripts/sidecars/build-ffmpeg.sh ff-arm64
          ARCH=x86_64 scripts/sidecars/build-ffmpeg.sh ff-x86_64
          lipo -create -output out/ffmpeg ff-arm64/ffmpeg ff-x86_64/ffmpeg
          scripts/sidecars/package.sh darwin universal out dist
      - uses: actions/upload-artifact@v4
        with: { name: sidecar-darwin, path: dist/* }

  linux:
    strategy:
      matrix:
        include:
          - { arch: amd64, runner: ubuntu-22.04 }
          - { arch: arm64, runner: ubuntu-22.04-arm }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: |
          sudo apt-get update && sudo apt-get install -y cmake
          scripts/sidecars/build-whisper.sh out
          scripts/sidecars/build-ffmpeg.sh out
          scripts/sidecars/package.sh linux ${{ matrix.arch }} out dist
      - uses: actions/upload-artifact@v4
        with: { name: "sidecar-linux-${{ matrix.arch }}", path: dist/* }

  windows:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: |
          sudo apt-get update && sudo apt-get install -y mingw-w64 zip
          scripts/sidecars/build-ffmpeg.sh out x86_64-w64-mingw32-
          scripts/sidecars/package.sh windows amd64 out dist
          scripts/sidecars/package.sh windows amd64 out dist cuda
      - uses: actions/upload-artifact@v4
        with: { name: sidecar-windows, path: dist/* }

  publish:
    needs: [macos, linux, windows]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { path: dist, pattern: "sidecar-*", merge-multiple: true }
      - name: Manifest
        env:
          TAG: ${{ inputs.tag }}
        run: |
          python3 - <<'PY'
          import hashlib, json, os
          tag = os.environ["TAG"]
          base = f"https://github.com/${{ github.repository }}/releases/download/{tag}/"
          entries = {
              "transcription_darwin_universal.tar.gz": ("darwin/universal", "metal"),
              "transcription_linux_amd64.tar.gz": ("linux/amd64", "cpu"),
              "transcription_linux_arm64.tar.gz": ("linux/arm64", "cpu"),
              "transcription_windows_amd64.zip": ("windows/amd64", "cpu"),
              "transcription_windows_amd64_cuda.zip": ("windows/amd64/cuda", "cuda"),
          }
          packages = {}
          for name, (key, accel) in entries.items():
              body = open(f"dist/{name}", "rb").read()
              packages[key] = {"url": base + name, "sha256": hashlib.sha256(body).hexdigest(), "size": len(body), "accel": accel}
          manifest = {"version": tag, "packages": packages}
          json.dump(manifest, open("internal/sidecar/manifest.json", "w"), indent=2)
          open("internal/sidecar/manifest.json", "a").write("\n")
          PY
          cp internal/sidecar/manifest.json dist/manifest.json
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          gh release create "$TAG" dist/* --title "Transcription programs ($TAG)" \
            --notes "whisper.cpp ${WHISPER_VERSION} and ffmpeg ${FFMPEG_VERSION}, built by .github/workflows/sidecars.yml. The app downloads these when transcription is turned on." --latest=false
      - name: Pull request pinning them
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "sidecars/$TAG"
          git add internal/sidecar/manifest.json
          git commit -m "build(sidecar): pin the transcription programs of $TAG"
          git push origin "sidecars/$TAG"
          gh pr create --title "build(sidecar): pin the transcription programs of $TAG" \
            --body "Points internal/sidecar/manifest.json at the archives of the $TAG release, with their sha256."
